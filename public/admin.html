<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用戶管理｜BotNest 管理中心</title><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/admin-center.css"><script type="module" src="/admin.js"></script></head>
<body><header><a href="/">BotNest</a><span>管理中心</span><a href="/#account">返回工作空間 ↗</a></header><nav class="admin-menu" aria-label="管理中心頁面"><a href="/admin.html" aria-current="page">用戶管理</a><a href="/watch-938adf15f764493c9d8c2ad6205da79b.html">資安監控</a></nav>
<main><div class="heading"><div><p class="eyebrow">WORKSPACE ADMIN</p><h1>用戶管理</h1><p>掌握帳號、平台連線與 AI 使用狀況。</p></div><div class="actions"><button id="login">Google 管理者驗證</button><button id="logout" hidden>登出</button></div></div>
<p id="status" role="status" aria-live="polite">正在確認管理者身分…</p>
<section id="dashboard" hidden>
<div class="cards"><article><span>本頁帳號</span><strong id="count">—</strong><small>每頁最多 25 位</small></article><article><span>本頁可使用</span><strong id="active">—</strong><small>未停用的帳號</small></article><article><span>本頁已停用</span><strong id="disabled">—</strong><small>阻擋網站操作與 AI 回覆</small></article><article><span>本頁 AI 請求</span><strong id="requests">—</strong><small id="month-label">本月累計</small></article></div>
<section class="panel"><div class="toolbar"><label>搜尋本頁<input id="search" type="search" placeholder="姓名、Email 或 UID"></label><label>用量月份<input id="month" type="month" min="2020-01" max="2099-12"></label><button id="refresh">重新整理</button></div>
<div class="table-wrap"><table><thead><tr><th>用戶</th><th>註冊與登入</th><th>連線平台</th><th>方案</th><th>當月用量</th><th>帳號狀態</th><th>管理</th></tr></thead><tbody id="users"></tbody></table></div>
<div class="pagination"><span id="page-label"></span><button id="prev">上一頁</button><button id="next">下一頁</button></div></section>
<p class="footnote">註冊方式：舊帳號未記錄最初註冊來源，顯示現有登入方式及註冊時間。平台為 BotNest 儲存的綁定紀錄，未即時檢查第三方授權。方案與額度尚未啟用，不以 AI token 冒充方案額度。</p>
</section></main>
<dialog id="confirm"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-user"></p><p id="confirm-detail"></p><div class="actions"><button value="cancel">取消</button><button id="confirm-submit" value="confirm">確認</button></div></form></dialog>
</body></html>
